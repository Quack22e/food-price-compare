# What each platform's terms say about scripts: reads the three published
# terms pages (or the newest Wayback capture when a page cannot be read) and
# commits the verbatim sentences to live-verification/terms.json. Three pages,
# robots.txt-checked, 3 s apart. See scripts/terms_check.py.
name: fpc-terms-check
on:
  workflow_dispatch: {}   # manual runs only
permissions:
  contents: write
concurrency:
  group: fpc-terms-check
  cancel-in-progress: false
jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Read the published terms pages (robots.txt-compliant)
        run: python scripts/terms_check.py --out live-verification
      - name: Commit the quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-verification/terms.json
          git commit -m "Terms check (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
